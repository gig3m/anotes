[package]
name = "anotes"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "A GTK4 desktop client for Apple Notes, over an applenotes daemon"
license = "MIT"
repository = "https://github.com/gig3m/anotes"

[dependencies]
gtk = { package = "gtk4", version = "0.10", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.8", features = ["v1_6"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-channel = "2"

[profile.release]
strip = true
